<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0512">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Impostor Ka">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>IMPOSTOR KA!! — One word. One imposter. Trust nobody.</title>
<style>
/* ============================================================
   IMPOSTOR KA!! — Original visual identity
   ============================================================ */
:root{
  --bg:#0b0512;
  --surface:#1a0f2e;
  --surface2:#241540;
  --surface3:#2e1b52;
  --border:#3b2364;
  --purple:#a855f7;
  --purple2:#c084fc;
  --purple-dark:#7c3aed;
  --blue:#38bdf8;
  --blue-dark:#0ea5e9;
  --red:#f43f5e;
  --red-dark:#be123c;
  --green:#22c55e;
  --amber:#fbbf24;
  --text:#f5f1ff;
  --muted:#a394c4;
  --radius:18px;
  --shadow:0 12px 40px -12px rgba(168,85,247,.55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;min-height:100%;}
body{
  background:
    radial-gradient(900px 600px at 50% -8%, #35195f 0%, rgba(53,25,95,0) 60%),
    radial-gradient(700px 500px at 100% 100%, #131a4a 0%, rgba(19,26,74,0) 55%),
    #0b0512;
  background-attachment:fixed;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;
  line-height:1.45;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
#app{
  max-width:600px;
  margin:0 auto;
  padding:calc(14px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
  min-height:100dvh;
  display:flex;
  flex-direction:column;
}
button{font-family:inherit;}
input,textarea,select{font-family:inherit;}
/* ---------- animations ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes popIn{0%{opacity:0;transform:scale(.85);}60%{transform:scale(1.04);}100%{opacity:1;transform:scale(1);}}
@keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
@keyframes glowPulse{0%,100%{filter:drop-shadow(0 0 10px rgba(168,85,247,.5));}50%{filter:drop-shadow(0 0 26px rgba(56,189,248,.8));}}
@keyframes shimmer{0%{background-position:-200% 0;}100%{background-position:200% 0;}}
@keyframes spinSlow{to{transform:rotate(360deg);}}
.screen{animation:fadeUp .3s ease both;flex:1;display:flex;flex-direction:column;gap:14px;}
body.reduce-motion .screen,
body.reduce-motion *{animation:none!important;transition:none!important;}
/* ---------- layout helpers ---------- */
.center{align-items:center;justify-content:center;text-align:center;}
.row{display:flex;gap:10px;align-items:center;}
.col{display:flex;flex-direction:column;gap:10px;}
.grow{flex:1;}
.spacer{flex:1;}
.muted{color:var(--muted);}
.small{font-size:13px;}
.tiny{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;}
h1,h2,h3{margin:0;line-height:1.15;}
h1{font-size:28px;font-weight:900;letter-spacing:-.5px;}
h2{font-size:22px;font-weight:800;}
h3{font-size:17px;font-weight:800;}
/* ---------- logo ---------- */
.logo-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;}
.logo-mark{width:104px;height:104px;animation:floaty 4s ease-in-out infinite,glowPulse 3s ease-in-out infinite;}
.logo-text{
  font-size:30px;font-weight:900;letter-spacing:1.5px;line-height:1;
  background:linear-gradient(100deg,#c084fc,#a855f7 30%,#38bdf8 70%,#c084fc);
  background-size:200% auto;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shimmer 5s linear infinite;
  text-align:center;
}
.logo-sub{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);font-weight:800;text-align:center;}
/* ---------- buttons ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:9px;
  width:100%;padding:14px 18px;border-radius:15px;
  border:1px solid var(--border);
  background:var(--surface2);
  color:var(--text);font-size:16px;font-weight:800;
  cursor:pointer;transition:transform .12s ease,filter .15s ease,box-shadow .15s ease;
  user-select:none;text-align:center;
}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-primary{background:linear-gradient(135deg,#b06bff,#7c3aed);border-color:transparent;box-shadow:0 10px 28px -10px #a855f7;}
.btn-blue{background:linear-gradient(135deg,#38bdf8,#0ea5e9);border-color:transparent;color:#04121f;}
.btn-danger{background:linear-gradient(135deg,#f43f5e,#be123c);border-color:transparent;}
.btn-green{background:linear-gradient(135deg,#34d399,#059669);border-color:transparent;color:#03150f;}
.btn-ghost{background:rgba(255,255,255,.03);}
.btn-sm{padding:10px 14px;font-size:14px;border-radius:12px;width:auto;}
.btn-big{padding:18px;font-size:18px;border-radius:18px;}
.btn-icon{width:44px;height:44px;padding:0;border-radius:14px;flex-shrink:0;}
/* ---------- cards ---------- */
.card{
  background:linear-gradient(180deg,#1e1136,#150c27);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
}
.card-tight{padding:12px;}
.card-glow{box-shadow:0 0 0 1px rgba(168,85,247,.25),0 18px 50px -20px rgba(168,85,247,.6);}
/* ---------- topbar ---------- */
.topbar{display:flex;align-items:center;gap:10px;min-height:44px;}
.topbar .title{font-weight:800;font-size:16px;}
.back-btn{
  width:40px;height:40px;border-radius:12px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-size:18px;display:flex;
  align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
}
.back-btn:active{transform:scale(.94);}
/* ---------- avatars ---------- */
.avatar{
  width:44px;height:44px;border-radius:50%;
  background:linear-gradient(135deg,#3a2168,#241540);
  border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;flex-shrink:0;
}
.avatar.big{width:88px;height:88px;font-size:44px;}
.avatar.sm{width:34px;height:34px;font-size:17px;}
.avatar.dead{filter:grayscale(1);opacity:.35;}
/* ---------- pills / chips ---------- */
.pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 12px;border-radius:999px;
  background:var(--surface2);border:1px solid var(--border);
  font-size:12.5px;font-weight:700;color:var(--muted);
}
.pill.on{background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;border-color:transparent;}
.pill.blue{background:rgba(56,189,248,.14);color:var(--blue);border-color:rgba(56,189,248,.35);}
.pill.red{background:rgba(244,63,94,.14);color:#fb7185;border-color:rgba(244,63,94,.35);}
.pill.green{background:rgba(34,197,94,.14);color:#4ade80;border-color:rgba(34,197,94,.35);}
.pill.amber{background:rgba(251,191,36,.14);color:var(--amber);border-color:rgba(251,191,36,.35);}
.chip-grid{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  padding:9px 14px;border-radius:12px;border:1px solid var(--border);
  background:var(--surface);color:var(--muted);font-size:13.5px;font-weight:700;
  cursor:pointer;transition:all .15s ease;user-select:none;
}
.chip:active{transform:scale(.95);}
.chip.on{background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;border-color:transparent;box-shadow:0 6px 18px -8px #a855f7;}
/* ---------- form ---------- */
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
.input,textarea.input{
  width:100%;padding:14px 16px;border-radius:14px;
  border:1px solid var(--border);background:#120a22;color:var(--text);
  font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s;
}
.input:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(168,85,247,.18);}
textarea.input{resize:vertical;min-height:90px;}
/* ---------- lists ---------- */
.list{display:flex;flex-direction:column;gap:8px;}
.list-item{
  display:flex;align-items:center;gap:12px;
  padding:11px 14px;border-radius:14px;
  background:var(--surface);border:1px solid var(--border);
}
.list-item .name{font-weight:700;font-size:15px;}
.list-item .meta{font-size:12px;color:var(--muted);}
/* ---------- progress ---------- */
.bar{height:9px;border-radius:999px;background:#251743;overflow:hidden;}
.bar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#a855f7,#38bdf8);transition:width .4s ease;}
/* ---------- splash ---------- */
.splash{justify-content:center;align-items:center;gap:18px;}
/* ---------- role card ---------- */
.role-card{
  border-radius:22px;padding:22px 18px;text-align:center;
  border:2px solid var(--border);
  background:linear-gradient(180deg,#241540,#140b25);
  animation:popIn .4s ease both;
  position:relative;overflow:hidden;
}
.role-card::before{
  content:"";position:absolute;inset:-40% -40% auto -40%;height:80%;
  background:radial-gradient(circle,rgba(168,85,247,.35),transparent 65%);
  pointer-events:none;
}
.role-card.imposter{border-color:rgba(244,63,94,.65);box-shadow:0 0 40px -8px rgba(244,63,94,.55);}
.role-card.imposter::before{background:radial-gradient(circle,rgba(244,63,94,.4),transparent 65%);}
.role-card.normal{border-color:rgba(56,189,248,.55);box-shadow:0 0 40px -8px rgba(56,189,248,.45);}
.role-card.spy{border-color:rgba(251,191,36,.6);box-shadow:0 0 40px -8px rgba(251,191,36,.5);}
.role-card.spy::before{background:radial-gradient(circle,rgba(251,191,36,.35),transparent 65%);}
.role-card.detective{border-color:rgba(34,197,94,.6);box-shadow:0 0 40px -8px rgba(34,197,94,.5);}
.role-card.jester{border-color:rgba(192,132,252,.7);box-shadow:0 0 40px -8px rgba(192,132,252,.55);}
.role-card.amnesiac{border-color:rgba(148,163,184,.6);}
.role-card.twin{border-color:rgba(139,92,246,.65);}
.role-icon{font-size:56px;line-height:1;position:relative;}
.role-name{font-size:24px;font-weight:900;letter-spacing:-.4px;margin-top:8px;position:relative;}
.role-desc{font-size:14px;color:var(--muted);margin-top:8px;position:relative;}
.word-box{
  margin-top:16px;padding:16px;border-radius:16px;
  background:rgba(56,189,248,.09);border:1px dashed rgba(56,189,248,.45);
  position:relative;
}
.word-box .lbl{font-size:10.5px;letter-spacing:.22em;color:var(--blue);font-weight:900;}
.word-box .val{font-size:30px;font-weight:900;letter-spacing:-.5px;margin:4px 0;word-break:break-word;}
.word-box .cat{font-size:12.5px;color:var(--muted);font-weight:700;}
/* ---------- peek / hold ---------- */
.peek{
  border-radius:16px;padding:16px;border:1px solid var(--border);
  background:linear-gradient(180deg,#1e1136,#150c27);
  transition:filter .18s ease;
}
.peek .secret{filter:blur(11px);transition:filter .18s ease;user-select:none;}
.peek.showing .secret{filter:blur(0);}
.peek .hidden-note{color:var(--muted);font-size:13px;text-align:center;font-weight:700;}
/* ---------- clue list ---------- */
.clue-row{
  display:flex;gap:12px;padding:12px 14px;border-radius:14px;
  background:var(--surface);border:1px solid var(--border);
}
.clue-row .who{font-weight:800;font-size:13.5px;color:var(--purple2);}
.clue-row .txt{font-size:15px;margin-top:2px;word-break:break-word;}
/* ---------- vote bars ---------- */
.vote-row{display:flex;align-items:center;gap:10px;}
.vote-row .bar{flex:1;}
.vote-row .cnt{font-weight:900;font-size:14px;min-width:22px;text-align:right;}
/* ---------- toast ---------- */
#toast-root{position:fixed;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:9999;pointer-events:none;padding:0 16px;}
.toast{
  max-width:420px;width:100%;padding:13px 16px;border-radius:14px;
  background:rgba(36,21,64,.97);border:1px solid var(--border);
  color:var(--text);font-size:14px;font-weight:700;text-align:center;
  box-shadow:0 18px 40px -14px #000;animation:fadeUp .25s ease both;
  transition:opacity .3s,transform .3s;
}
.toast.out{opacity:0;transform:translateY(12px);}
.toast.good{border-color:rgba(34,197,94,.6);}
.toast.bad{border-color:rgba(244,63,94,.6);}
/* ---------- misc ---------- */
.divider{height:1px;background:var(--border);margin:4px 0;}
.badge-dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;}
.sticky-bottom{position:sticky;bottom:0;padding-top:10px;background:linear-gradient(180deg,rgba(11,5,18,0),rgba(11,5,18,.92) 35%);}
.seg{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:4px;gap:4px;}
.seg button{
  flex:1;padding:10px;border-radius:10px;border:0;background:transparent;
  color:var(--muted);font-weight:800;font-size:14px;cursor:pointer;transition:all .15s;
}
.seg button.on{background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;}
.toggle{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:13px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--border);
  cursor:pointer;user-select:none;
}
.toggle .sw{width:48px;height:28px;border-radius:999px;background:#2c1b4d;position:relative;transition:background .2s;flex-shrink:0;}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#8a7aa8;transition:all .2s;}
.toggle.on .sw{background:linear-gradient(135deg,#8b5cf6,#6d28d9);}
.toggle.on .sw::after{left:23px;background:#fff;}
.timer-ring{font-variant-numeric:tabular-nums;font-weight:900;}
.timer-ring.low{color:var(--red);animation:fadeIn .6s ease infinite alternate;}
.res-banner{
  border-radius:22px;padding:26px 18px;text-align:center;
  background:linear-gradient(160deg,#2a1350,#140b25);
  border:2px solid var(--border);
  animation:popIn .5s ease both;
}
.res-banner.win{border-color:rgba(34,197,94,.65);box-shadow:0 0 60px -12px rgba(34,197,94,.6);}
.res-banner.lose{border-color:rgba(244,63,94,.6);box-shadow:0 0 60px -12px rgba(244,63,94,.5);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.mode-card{
  padding:13px 12px;border-radius:15px;border:1px solid var(--border);
  background:var(--surface);cursor:pointer;transition:all .15s ease;
  text-align:left;display:flex;flex-direction:column;gap:3px;
}
.mode-card:active{transform:scale(.97);}
.mode-card.on{border-color:transparent;background:linear-gradient(135deg,#7c3aed,#5b21b6);box-shadow:0 10px 26px -10px #a855f7;}
.mode-card .m-name{font-weight:900;font-size:14px;}
.mode-card .m-desc{font-size:11.5px;color:var(--muted);line-height:1.3;}
.mode-card.on .m-desc{color:rgba(255,255,255,.8);}
.emoji-btn{
  font-size:26px;padding:12px;border-radius:14px;background:var(--surface2);
  border:1px solid var(--border);cursor:pointer;transition:transform .1s;
}
.emoji-btn:active{transform:scale(.9);}
.ach{
  display:flex;gap:12px;align-items:center;padding:13px 14px;border-radius:14px;
  background:var(--surface);border:1px solid var(--border);
}
.ach.locked{opacity:.45;}
.ach .ic{font-size:26px;}
.ach .an{font-weight:800;font-size:14px;}
.ach .ad{font-size:12px;color:var(--muted);}

/* ============================================================
   GRAPHICS UPGRADE LAYER (appended; nothing above was removed)
   ============================================================ */
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false;}
@keyframes holo{to{--a:360deg;}}
@keyframes starDrift{to{background-position:240px 200px;}}
@keyframes dangerPulse{from{transform:scale(1);text-shadow:0 0 0 rgba(244,63,94,0);}to{transform:scale(1.07);text-shadow:0 0 22px rgba(244,63,94,.95);}}
@keyframes confettiFall{to{background-position:0 110px,40px 120px,20px 200px;}}
@keyframes iconBob{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-6px) rotate(2deg);}}
:root{--ring:rgba(192,132,252,.18);--glass:rgba(36,21,64,.55);--hi:inset 0 1px 0 rgba(255,255,255,.08);}
body{font-family:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:
    radial-gradient(1.2px 1.2px at 20px 30px,#fff,transparent),
    radial-gradient(1px 1px at 90px 120px,#c4b5fd,transparent),
    radial-gradient(1.4px 1.4px at 160px 60px,#fff,transparent),
    radial-gradient(1px 1px at 210px 170px,#7dd3fc,transparent);
  background-size:240px 200px;animation:starDrift 120s linear infinite;
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%);
}
h1,h2,h3{letter-spacing:-.02em;}
h1{font-size:30px;}
/* logo */
.logo-wrap{position:relative;isolation:isolate;}
.logo-wrap::before{
  content:"";position:absolute;top:-22px;left:50%;margin-left:-80px;width:160px;height:160px;border-radius:50%;z-index:-1;
  background:conic-gradient(from 0deg,rgba(168,85,247,0),rgba(168,85,247,.65),rgba(56,189,248,.6),rgba(244,63,94,.35),rgba(168,85,247,0));
  filter:blur(26px);animation:spinSlow 10s linear infinite;
}
.logo-mark{width:116px;height:116px;}
.logo-text{font-size:36px;letter-spacing:.04em;filter:drop-shadow(0 4px 18px rgba(168,85,247,.55));}
.logo-sub{color:#b9a9dc;}
/* buttons: chunky, tactile */
.btn{
  border-color:rgba(192,132,252,.22);
  background:linear-gradient(180deg,rgba(60,36,104,.9),rgba(36,21,64,.95));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -3px 0 rgba(0,0,0,.28),0 8px 18px -10px #000;
  text-shadow:0 1px 0 rgba(0,0,0,.35);
}
.btn:active{transform:translateY(2px) scale(.99);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 -1px 0 rgba(0,0,0,.28),0 3px 8px -6px #000;}
.btn-primary{box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -3px 0 rgba(60,10,140,.55),0 12px 30px -10px #a855f7;}
.btn-blue{box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -3px 0 rgba(3,60,100,.4),0 12px 28px -12px #38bdf8;text-shadow:none;}
.btn-danger{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(90,0,20,.5),0 12px 28px -10px #f43f5e;}
.btn-green{box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -3px 0 rgba(0,70,40,.4),0 12px 28px -12px #22c55e;text-shadow:none;}
.btn-ghost{background:rgba(255,255,255,.04);box-shadow:var(--hi);}
.btn-big{letter-spacing:.01em;}
/* glass surfaces */
.card{
  background:linear-gradient(160deg,rgba(48,28,86,.74),rgba(21,12,39,.86));
  border-color:var(--ring);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:var(--hi),0 16px 36px -22px #000;
}
.card-glow{box-shadow:var(--hi),0 0 0 1px rgba(168,85,247,.3),0 20px 54px -20px rgba(168,85,247,.7);}
.list-item,.clue-row,.toggle,.ach,.mode-card,.back-btn,.seg,.peek{background:var(--glass);border-color:var(--ring);box-shadow:var(--hi);}
.mode-card.on{border-color:transparent;background:linear-gradient(135deg,#7c3aed,#5b21b6);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 0 0 2px rgba(192,132,252,.75),0 16px 32px -12px #a855f7;}
.chip{background:var(--glass);border-color:var(--ring);}
.chip.on,.pill.on,.seg button.on,.toggle.on .sw{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 18px -8px #a855f7;}
.pill{background:var(--glass);}
.input,textarea.input{background:rgba(10,5,20,.72);border-color:var(--ring);box-shadow:inset 0 2px 6px rgba(0,0,0,.4);}
.input:focus{border-color:#c084fc;box-shadow:inset 0 2px 6px rgba(0,0,0,.4),0 0 0 3px rgba(168,85,247,.28),0 0 24px -6px rgba(168,85,247,.7);}

      .filter((t) => t.id !== 'RANDOM_CHAOS')
      .filter((t) => t.min <= playerCount)
      .filter((t) => !list.some((x) => TWIST_MAP[x] && TWIST_MAP[x].conflicts.includes(t.id)))

    list = list.filter((t) => t !== 'RANDOM_CHAOS');
    if (candidates.length) {
      const chosen = pick(candidates);
      list.push(chosen.id);
      if (chosen.id === 'DOUBLE_IMPOSTER' || chosen.id === 'HIDDEN_TWIN_WORDS') {

    if (def.min > playerCount) return;

    g.mainCat = nw.cat;
    g.players.forEach((p) => {
      if ((isNormalTeam(p.role) && p.role !== 'AMNESIAC') || p.role === 'JESTER') { p.word = nw.w; p.cat = nw.cat; }
    });
    g.log.push('The secret word changed!');
    toast('🔄 The secret word has changed!', '');
  }
  beginClueRound();
}
function submitFinalGuess(text) {
  const g = state.game;
  const guess = String(text || '').trim().toLowerCase();
  const correct = guess.length > 0 && guess === String(g.mainWord).toLowerCase();
  g.finalGuessResult = { guess: String(text || '').trim(), correct };
  if (correct) {
    gameOver('IMPOSTER', 'The imposter guessed the secret word — the imposters win!');
  } else {
    gameOver('NORMAL', 'The final guess was wrong. The normal team wins!');
  }
}
function gameOver(winner, reason) {
  const g = state.game;
  g.phase = 'GAME_OVER';
  g.winner = winner;
  g.reason = reason || '';
  applyRewards();
  if (winner === 'IMPOSTER' || winner === 'SPY' || winner === 'JESTER') SFX.lose();
  else SFX.win();
  go('results');
}
/* ---------------------------------------------------------------
   8. REWARDS / XP / ACHIEVEMENTS
--------------------------------------------------------------- */
function applyRewards() {
  const g = state.game;
  if (g.rewardsApplied) return;
  g.rewardsApplied = true;
  const me = g.players[g.meIndex];
  const u = state.user;
  if (!u || !me) { g.rewardSummary = null; return; }
  const won = playerWon(me, g);
  const breakdown = [];
  let xp = 30;
  breakdown.push({ label: 'Participation', amount: 30 });
  if (won) { xp += 60; breakdown.push({ label: 'Victory', amount: 60 }); }
  if (won && me.role === 'IMPOSTER') { xp += 40; breakdown.push({ label: 'Imposter win bonus', amount: 40 }); }
  if (won && !isNormalTeam(me.role) && me.role !== 'IMPOSTER') { xp += 30; breakdown.push({ label: 'Special role bonus', amount: 30 }); }
  if (me.alive) { xp += 15; breakdown.push({ label: 'Survived', amount: 15 }); }
  if (me.partner != null && won) {
    const partner = g.players[me.partner];
    if (partner && partner.alive && me.alive) { xp += 25; breakdown.push({ label: 'Partners survived', amount: 25 }); }
  }
  // ---- stats ----
  u.matches = (u.matches || 0) + 1;
  if (won) {
    u.wins = (u.wins || 0) + 1;
    u.streak = (u.streak || 0) + 1;
    u.bestStreak = Math.max(u.bestStreak || 0, u.streak);
    if (me.role === 'IMPOSTER') u.imposterWins = (u.imposterWins || 0) + 1;
    else if (isNormalTeam(me.role)) u.normalWins = (u.normalWins || 0) + 1;
    else u.specialWins = (u.specialWins || 0) + 1;
  } else {
    u.losses = (u.losses || 0) + 1;
    u.streak = 0;
  }
  // ---- achievements ----
  const unlocked = [];
  const grant = (id) => {
    if (!u.achievements) u.achievements = {};
    if (u.achievements[id]) return;
    u.achievements[id] = Date.now();
    unlocked.push(ACH_MAP[id]);
    xp += 25;
  };
  grant('FIRST_GAME');
  if (won) grant('FIRST_WIN');
  if (won && me.role === 'IMPOSTER') grant('IMPOSTER_WIN');
  if (won && me.role === 'DETECTIVE') grant('PERFECT_DETECTIVE');
  if (won && me.role === 'JESTER') grant('JESTER_TRIUMPH');
  if (won && me.role === 'SPY') grant('SPY_MASTER');
  if (won && me.role === 'TWIN_A' || (won && me.role === 'TWIN_B')) grant('TWIN_WIN');
  if (won && g.mode === 'CHAOS') grant('CHAOS_SURVIVOR');
  if (won && g.mode === 'SPEED') grant('SPEED_DEMON');
  if (won && g.twists.includes('SILENT_IMPOSTER')) grant('SILENT_SURVIVOR');
  if (won && me.partner != null) {
    const partner = g.players[me.partner];
    if (partner && partner.alive && me.alive) grant('PARTNERED');
  }
  if ((u.imposterWins || 0) >= 5) grant('MASTER_DECEIVER');
  if ((u.bestStreak || 0) >= 5) grant('FIVE_STREAK');
  if ((u.matches || 0) >= 100) grant('HUNDRED_GAMES');
  u.xp = (u.xp || 0) + xp;
  u.level = levelFromXp(u.xp).level;
  // ---- history ----
  u.history = u.history || [];
  u.history.unshift({
    date: Date.now(),
    mode: g.mode,
    winner: g.winner,
    won,
    role: me.role,
    word: g.mainWord,
    category: g.mainCat,
    players: g.players.length,
    xp
  });
  u.history = u.history.slice(0, 60);
  if (!state.isGuest) {
    state.profiles[u.username.toLowerCase()] = u;
    saveProfiles();
  }
  g.rewardSummary = { xp, breakdown, unlocked, won };
}

   9. TIMER
--------------------------------------------------------------- */
function startTimer(seconds, onEnd) {
  stopTimer();
  timerRef = { end: Date.now() + seconds * 1000, onEnd, fired: false, total: seconds };
}
function stopTimer() { timerRef = null; }
setInterval(() => {
  if (!timerRef) return;
  const left = Math.max(0, timerRef.end - Date.now());
  const el = document.getElementById('timerDisplay');
  if (el) {
    el.textContent = Math.ceil(left / 1000) + 's';
    el.classList.toggle('low', left < 11000);
  }
  if (left <= 0 && !timerRef.fired) {
    timerRef.fired = true;
    const cb = timerRef.onEnd;
    if (cb) cb();
  }
}, 200);

              <span class="muted">Role: ${ROLE_META[m.role] ? ROLE_META[m.role].name : m.role}</span>

      </div>`}
  </div>`;
};
/* ---------- WORD VAULT ---------- */
SCREENS.words = () => {

    <div class="card card-tight">

};
/* ---------- SETTINGS ---------- */
SCREENS.settings = () => `<div class="screen">
  ${topBar('Settings', 'menu')}
  <div class="card col" style="gap:8px">
    <div class="toggle ${state.settings.sound ? 'on' : ''}" data-action="toggleSound">
      <div><div style="font-weight:800;font-size:14px">Sound Effects</div>
      <div class="tiny" style="text-transform:none;letter-spacing:0;font-weight:600">Synthesised in-browser, no assets</div></div>

/* ---------- RULES ---------- */
SCREENS.rules = () => `<div class="screen">
  ${topBar('How to Play', 'menu')}
  <div class="card">
    <h3 style="margin-bottom:8px">The Basics</h3>
    <div class="small muted" style="line-height:1.75">
      1. Everyone gets the same secret word — except the imposter.<br>
      2. Each player gives a one-word clue about the secret word.<br>

/* ---------------------------------------------------------------
   12. ACTIONS (event delegation)
--------------------------------------------------------------- */
const ACTIONS = {
  /* navigation */
  go(el) {
    const to = el.dataset.to;
    if (to) { SFX.tap(); go(to); }
  },
  back(el) {
    SFX.tap();
    go(el.dataset.to || 'menu');
  },
  /* auth */
  guest() {
    SFX.tap();
    state.user = guestLogin('Guest');
    state.isGuest = true;
    state.draft = defaultDraft();
    state.draft.meIndex = 0;
    go('menu');
  },
  pickAvatar(el) {
    state.ui.pickAvatar = el.dataset.av;
    const ru = $('#regUser'), rn = $('#regName'), rp = $('#regPin');
    if (ru) state.ui.regUser = ru.value;
    if (rn) state.ui.regName = rn.value;
    if (rp) state.ui.regPin = rp.value;
    render();
  },
  doRegister() {
    const username = $('#regUser').value;
    const displayName = $('#regName').value.trim();
    const pin = $('#regPin').value;
    const res = registerAccount(username, displayName || username, pin, state.ui.pickAvatar || '🕵️');
    if (res.error) { toast(res.error, 'bad'); return; }
    state.user = res.profile;
    state.isGuest = false;
    state.ui.regUser = ''; state.ui.regName = ''; state.ui.regPin = '';
    saveSession();
    state.draft = defaultDraft();
    toast('Welcome, ' + res.profile.displayName + '!');
    go('menu');
  },
  doLogin() {
    const username = $('#loginUser').value;
    const pin = $('#loginPin').value;
    const res = loginAccount(username, pin);
    if (res.error) { toast(res.error, 'bad'); return; }
    state.user = res.profile;
    state.isGuest = false;
    saveSession();
    state.draft = defaultDraft();
    toast('Welcome back, ' + res.profile.displayName + '!');
    go('menu');
  },
  logout() {
    state.user = null;
    state.isGuest = false;
    LS.set('session', null);
    go('welcome');
  },
  /* setup */
  addPlayer() {
    const d = state.draft;
    if (d.players.length >= 12) return;
    d.players.push({
      name: 'Player ' + (d.players.length + 1),
      avatar: AVATARS[d.players.length % AVATARS.length]
    });
    SFX.tap();
    render();
  },
  removePlayer() {
    const d = state.draft;
    if (d.players.length <= 3) return;
    d.players.pop();
    if (d.meIndex >= d.players.length) d.meIndex = d.players.length - 1;
    render();
  },
  cycleAvatar(el) {
    const i = Number(el.dataset.idx);
    const p = state.draft.players[i];
    const cur = AVATARS.indexOf(p.avatar);
    p.avatar = AVATARS[(cur + 1) % AVATARS.length];
    SFX.tap();
    render();
  },
  setMe(el) {
    state.draft.meIndex = Number(el.dataset.idx);
    SFX.tap();
    render();
  },
  setMode(el) {
    const m = el.dataset.mode;
    state.draft.mode = m;
    // mode-driven defaults
    if (m === 'MULTI') state.draft.imposters = Math.max(2, state.draft.imposters);
    if (m === 'SPY' || m === 'HIDDEN') state.draft.imposters = 1;
    if (m === 'SPEED') state.draft.discussTime = 30;
    SFX.tap();
    render();
  },
  pickModeAndSetup(el) {
    state.draft = state.draft || defaultDraft();
    state.draft.mode = el.dataset.mode;
    go('setup');
  },
  allCats() {
    state.draft.categories = [];
    render();
  },
  toggleCat(el) {
    const c = el.dataset.cat;
    const d = state.draft;
    const i = d.categories.indexOf(c);
    if (i >= 0) d.categories.splice(i, 1);
    else d.categories.push(c);
    render();
  },
  toggleDiff(el) {
    const x = el.dataset.diff;
    const d = state.draft;
    const i = d.difficulties.indexOf(x);
    if (i >= 0) {
      if (d.difficulties.length === 1) { toast('At least one difficulty is required.'); return; }
      d.difficulties.splice(i, 1);
    } else d.difficulties.push(x);
    render();
  },
  setLang(el) {
    state.draft.language = el.dataset.lang;
    render();
  },
  toggleTwist(el) {
    const id = el.dataset.twist;
    const d = state.draft;
    const i = d.twists.indexOf(id);
    if (i >= 0) d.twists.splice(i, 1);
    else {
      const def = TWIST_MAP[id];
      const conflict = d.twists.find(t => TWIST_MAP[t] && (TWIST_MAP[t].conflicts.includes(id) || def.conflicts.includes(t)));
      if (conflict) { toast('Conflicts with ' + TWIST_MAP[conflict].name, 'bad'); return; }
      d.twists.push(id);
    }
    SFX.tap();
    render();
  },
  toggleTimers() { state.draft.timers = !state.draft.timers; render(); },
  toggleFinalGuess() { state.draft.finalGuess = !state.draft.finalGuess; render(); },
  toggleAnon() { state.draft.anonymousVote = !state.draft.anonymousVote; render(); },
  impMinus() { state.draft.imposters = Math.max(1, state.draft.imposters - 1); render(); },
  impPlus() {
    const max = Math.max(1, Math.floor((state.draft.players.length - 1) / 2));
    state.draft.imposters = Math.min(max, state.draft.imposters + 1);
    render();
  },
  timeMinus() { state.draft.discussTime = Math.max(15, state.draft.discussTime - 15); render(); },
  timePlus() { state.draft.discussTime = Math.min(180, state.draft.discussTime + 15); render(); },
  startGame() { startGame(); },
  /* quick play */
  quickPlay() {
    SFX.tap();
    const d = defaultDraft();
    d.players = [
      { name: 'Player 1', avatar: '🕵️' },
      { name: 'Player 2', avatar: '👽' },
      { name: 'Player 3', avatar: '🤖' },
      { name: 'Player 4', avatar: '🦊' },
      { name: 'Player 5', avatar: '🐼' },
      { name: 'Player 6', avatar: '🐸' }
    ];
    d.mode = 'CLASSIC';
    state.draft = d;
    startGame();
  },
  /* game flow */
  revealStart() {
    SFX.reveal();
    state.ui.revealStage = 'card';
    render();
  },
  revealNext() {
    SFX.tap();
    nextReveal();
  },
  clueStart() {
    SFX.tap();
    state.ui.clueStage = 'input';
    state.ui.clueText = '';
    render();
    const box = document.getElementById('clueInput');
    if (box) setTimeout(() => box.focus(), 120);
  },
  submitClue() {
    const g = state.game;
    const p = g.players[g.turnOrder[g.turnIdx]];
    const silent = g.twists.includes('SILENT_IMPOSTER') && p.role === 'IMPOSTER';
    if (silent) { toast('Silent Imposter: pick an emoji.'); return; }
    const box = document.getElementById('clueInput');
    const text = (box ? box.value : state.ui.clueText || '').trim();
    if (!text) { toast('Please enter a clue.', 'bad'); return; }
    p.clue = text.slice(0, 120);
    SFX.tap();
    nextClue();
  },
  pickEmoji(el) {
    const g = state.game;
    const p = g.players[g.turnOrder[g.turnIdx]];
    p.clue = el.dataset.emoji;
    SFX.tap();
    nextClue();
  },
  investigate(el) {
    const g = state.game;
    const p = g.players[g.turnOrder[g.turnIdx]];
    if (p.role !== 'DETECTIVE' || p.investigated) return;
    const target = g.players[Number(el.dataset.target)];
    p.investigated = true;
    state.ui.investigateResult = {
      name: target.name,
      isImposter: target.role === 'IMPOSTER' || target.role === 'SPY'
    };
    SFX.reveal();
    render();
  },
  beginVoting() {
    SFX.tap();
    beginVoting();
  },
  voteStart() {
    SFX.tap();
    state.ui.voteStage = 'select';
    render();
  },
  castVote(el) {
    submitVote(Number(el.dataset.target));
  },
  applyElimination() {
    SFX.tap();
    applyElimination();
  },
  afterElimination() {
    SFX.tap();
    afterElimination();
  },
  guessStart() {
    state.ui.guessStage = true;
    render();
    setTimeout(() => { const i = $('#finalGuessInput'); if (i) i.focus(); }, 120);
  },
  submitFinalGuess() {
    const box = $('#finalGuessInput');
    submitFinalGuess(box ? box.value : '');
  },
  playAgain() {
    SFX.tap();
    startGame();
  },
  /* settings */
  toggleSound() {
    state.settings.sound = !state.settings.sound;
    LS.set('settings', state.settings);
    if (state.settings.sound) SFX.tap();
    render();
  },
  toggleMotion() {
    state.settings.reducedMotion = !state.settings.reducedMotion;
    LS.set('settings', state.settings);
    render();
  },
  toggleHaptics() {
    state.settings.haptics = !state.settings.haptics;
    LS.set('settings', state.settings);
    render();
  },
  wipeData() {
    if (!confirm('Erase ALL local data — accounts, stats, achievements and history? This cannot be undone.')) return;
    Object.keys(localStorage).forEach((k) => {
      if (k.startsWith('ik_')) localStorage.removeItem(k);
    });
    state.user = null;
    state.profiles = {};
    state.isGuest = false;
    toast('All local data erased.');
    go('welcome');
  },
  /* word vault */
  wordCat(el) {
    state.ui.wordCat = el.dataset.cat;
    render();
  }
};
/* ---------------------------------------------------------------
   13. EVENT WIRING
--------------------------------------------------------------- */
app.addEventListener('click', (e) => {
  const t = e.target.closest('[data-action]');
  if (!t) return;
  const fn = ACTIONS[t.dataset.action];
  if (!fn) return;
  e.preventDefault();
  fn(t, e);
});
/* live text binding without re-render (preserves focus) */
app.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.bind === 'playerName') {
    const i = Number(t.dataset.idx);
    if (state.draft && state.draft.players[i]) state.draft.players[i].name = t.value.slice(0, 18);
  }
  if (t.dataset.bind === 'wordSearch') {
    state.ui.wordSearch = t.value;
    // Re-render the list only (debounced)
    clearTimeout(window.__wsT);
    window.__wsT = setTimeout(() => {
      const pos = t.selectionStart;
      render();
      const box = document.getElementById('wordSearch');
      if (box) { box.focus(); try { box.setSelectionRange(pos, pos); } catch (err) {} }
    }, 220);
  }
  if (t.id === 'clueInput') {
    state.ui.clueText = t.value;
  }
});
/* hold-to-reveal */
app.addEventListener('pointerdown', (e) => {
  const t = e.target.closest('[data-hold]');
  if (!t) return;
  const box = document.getElementById('peekBox');
  if (box) box.classList.add('showing');
  t.textContent = '👁️ Release to hide';
});
app.addEventListener('contextmenu', (e) => {
  if (e.target.closest('[data-hold]') || e.target.closest('#peekBox')) e.preventDefault();
});
document.addEventListener('pointerup', () => {
  document.querySelectorAll('.peek.showing').forEach((x) => x.classList.remove('showing'));
  document.querySelectorAll('[data-hold]').forEach((x) => { x.textContent = '👁️ Hold to see your role & word'; });
});
document.addEventListener('pointercancel', () => {
  document.querySelectorAll('.peek.showing').forEach((x) => x.classList.remove('showing'));
});
/* keyboard: Enter submits where helpful */
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const id = e.target.id;
  if (id === 'loginPin' || id === 'loginUser') { ACTIONS.doLogin(); }
  if (id === 'regPin') { ACTIONS.doRegister(); }
  if (id === 'finalGuessInput') { ACTIONS.submitFinalGuess(); }
});
/* ---------------------------------------------------------------
   14. BOOT
--------------------------------------------------------------- */
(function boot() {
  loadProfiles();
  const savedSettings = LS.get('settings', null);
  if (savedSettings) state.settings = Object.assign(state.settings, savedSettings);
  const sess = LS.get('session', null);
  if (sess && state.profiles[sess]) {
    state.user = state.profiles[sess];
    state.isGuest = false;
  }
  state.draft = defaultDraft();
  render();
})();
</script>
<script>
/* PWA: offline support + install button */
(function(){
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }
  var standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (standalone) return;
  var dismissed = false;
  try { dismissed = localStorage.getItem('ik_install_dismissed') === '1'; } catch(e){}
  if (dismissed) return;
  var deferred = null;
  function banner(text, btnText, onBtn){
    var b = document.createElement('div');
    b.style.cssText = 'position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);z-index:9999;display:flex;align-items:center;gap:10px;max-width:92vw;padding:10px 12px 10px 16px;border-radius:16px;background:rgba(30,17,54,.94);border:1px solid rgba(192,132,252,.35);box-shadow:0 12px 32px -10px #000;color:#f3eaff;font:600 14px system-ui,sans-serif;backdrop-filter:blur(10px)';
    var s = document.createElement('span'); s.textContent = text; b.appendChild(s);
    if (btnText) {
      var i = document.createElement('button'); i.textContent = btnText;
      i.style.cssText = 'border:0;border-radius:10px;padding:8px 14px;font:800 13px system-ui,sans-serif;color:#fff;background:linear-gradient(135deg,#a855f7,#7c3aed);cursor:pointer';
      i.onclick = function(){ onBtn(); b.remove(); }; b.appendChild(i);
    }
    var x = document.createElement('button'); x.textContent = '\u2715'; x.setAttribute('aria-label','Close');
    x.style.cssText = 'border:0;background:transparent;color:#b9a9dc;font-size:16px;cursor:pointer;padding:4px 6px';
    x.onclick = function(){ try { localStorage.setItem('ik_install_dismissed','1'); } catch(e){} b.remove(); };
    b.appendChild(x); document.body.appendChild(b);
    setTimeout(function(){ if (b.parentNode) b.remove(); }, 20000);
  }
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); deferred = e;
    banner('Install Impostor Ka!! as an app', 'Install', function(){
      deferred.prompt();
      deferred.userChoice.finally(function(){ deferred = null; });
    });
  });
  window.addEventListener('appinstalled', function(){ try { localStorage.setItem('ik_install_dismissed','1'); } catch(e){} });
  var ua = navigator.userAgent;
  if (/iphone|ipad|ipod/i.test(ua) && !/crios|fxios/i.test(ua)) {
    window.addEventListener('load', function(){ setTimeout(function(){
      banner('To install: tap Share, then "Add to Home Screen"', null, null);
    }, 1500); });
  }
})();
</script>
